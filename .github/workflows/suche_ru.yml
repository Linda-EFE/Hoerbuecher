name: Russische Hörbücher suchen
on:
  push:
    paths: ["tools/suche_ru.py", ".github/workflows/suche_ru.yml"]
permissions:
  contents: write
jobs:
  suche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/suche_ru.py > tools/russisch_liste.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/russisch_liste.txt
          git commit -m "Liste russischer Hörbücher" || exit 0
          git pull --rebase && git push

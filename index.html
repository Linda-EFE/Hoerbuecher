<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hörbücher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hörbücher">
<meta name="theme-color" content="#1c1712">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1712;
    --bg-2: #262019;
    --card: #2e2720;
    --card-hover: #3a3128;
    --line: #463b30;
    --text: #f4ece0;
    --muted: #b6a891;
    --accent: #e8a24a;
    --accent-dark: #c4822e;
    --accent-ink: #1c1712;
    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 Inter, system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: calc(96px + var(--safe-b));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Kopf ---------- */
  header.top {
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 0 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 36px; height: 36px; flex: none; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 700;
    font-size: clamp(30px, 7vw, 42px); margin: 0; letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); margin: 6px 0 0; }

  /* ---------- Übersicht ---------- */
  .liste { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }
  .buch {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px;
  }
  .buch img, .detail-cover img {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .buch .cover {
    width: 92px; height: 92px; flex: none; border-radius: 10px; overflow: hidden;
    background: var(--bg-2); box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .buch .info { flex: 1; min-width: 0; }
  .buch .autor { color: var(--muted); font-size: 14px; }
  .buch .titel {
    font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 19px;
    line-height: 1.2; margin: 2px 0 8px;
  }
  .knopf {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px;
  }
  .knopf:active { background: var(--accent-dark); transform: scale(.98); }
  .knopf svg { width: 16px; height: 16px; }
  .meta-zeile { color: var(--muted); font-size: 13px; margin: -6px 0 10px; }

  /* ---------- Detail / Titelauswahl ---------- */
  .zurueck {
    display: inline-flex; align-items: center; gap: 6px; background: none; border: 0;
    color: var(--accent); font-weight: 600; padding: 8px 4px 8px 0; font-size: 16px;
  }
  .zurueck svg { width: 22px; height: 22px; }
  .detail-kopf { display: flex; gap: 20px; align-items: flex-end; margin: 12px 0 18px; }
  .detail-cover {
    width: 150px; height: 150px; flex: none; border-radius: 14px; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); background: var(--bg-2);
  }
  .detail-kopf h2 {
    font-family: Fraunces, Georgia, serif; font-size: clamp(24px, 6vw, 32px);
    margin: 4px 0 6px; line-height: 1.1;
  }
  .beschreibung { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  .beschreibung.zu { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mehr { background: none; border: 0; color: var(--accent); padding: 0; font-size: 14px; margin: -12px 0 16px; }
  .kapitel-liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .kapitel {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px;
  }
  .kapitel:active { background: var(--card); }
  .kapitel .nr {
    width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .kapitel .k-titel { flex: 1; min-width: 0; }
  .kapitel .k-dauer { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .kapitel.aktiv .nr { background: var(--accent); color: var(--accent-ink); }
  .kapitel.aktiv .k-titel { color: var(--accent); font-weight: 600; }
  .fortschritt { display: block; height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .fortschritt i { display: block; height: 100%; background: var(--accent); }
  .quelle { color: var(--muted); font-size: 12px; margin: 22px 0 8px; }
  .quelle a { color: var(--muted); }

  /* ---------- Player ---------- */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(38,32,25,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 10px 0 calc(10px + var(--safe-b));
    transform: translateY(110%); transition: transform .25s ease;
  }
  .player.sichtbar { transform: none; }
  .p-oben { display: flex; align-items: center; gap: 12px; }
  .p-cover { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex: none; background: var(--bg); }
  .p-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .p-text { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; }
  .p-titel, .p-buch { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-titel { font-weight: 600; font-size: 15px; }
  .p-buch { color: var(--muted); font-size: 13px; }
  .tempo {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 10px; font-size: 13px; font-weight: 600; min-width: 54px;
  }
  .zeitleiste { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .zeitleiste span { width: 46px; }
  .zeitleiste span:last-child { text-align: right; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 28px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
  }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text); margin-top: -6px; border: 0;
  }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: 0; }
  .steuerung { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .s-knopf {
    background: none; border: 0; border-radius: 50%; width: 46px; height: 46px;
    display: grid; place-items: center; position: relative; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .s-knopf:active, .s-knopf.halten { background: var(--card-hover); }
  .s-knopf svg { width: 26px; height: 26px; }
  .s-knopf small { position: absolute; bottom: 4px; font-size: 9px; font-weight: 600; color: var(--muted); }
  .s-knopf:disabled { opacity: .3; }
  .s-knopf.play { width: 60px; height: 60px; background: var(--accent); color: var(--accent-ink); }
  .s-knopf.play:active { background: var(--accent-dark); }
  .s-knopf.play svg { width: 30px; height: 30px; }
  .hinweis { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }


  /* ---------- Suche & Filter ---------- */
  .filter { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .suchfeld { position: relative; display: block; }
  .suchfeld svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .suchfeld input {
    width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 12px 14px 12px 42px; font: inherit; font-size: 16px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .suchfeld input:focus { border-color: var(--accent); }
  .suchfeld input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font-size: 14px; color: var(--muted); white-space: nowrap;
  }
  .chip.an { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .filter-zeile { display: flex; gap: 8px; align-items: center; }
  .segment { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .segment button { background: none; border: 0; padding: 6px 10px; border-radius: 7px; font-size: 14px; color: var(--muted); }
  .segment button.an { background: var(--card-hover); color: var(--text); font-weight: 600; }
  select.sortierung {
    margin-left: auto; background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 6px; font: inherit; font-size: 14px; min-width: 0; max-width: 42%;
  }
  .anzahl { color: var(--muted); font-size: 13px; }
  .marke {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    padding: 1px 7px; border-radius: 999px; vertical-align: 1px; margin-left: 8px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .marke.lokal { border-color: var(--accent); color: var(--accent); }
  #mehr-laden { height: 40px; }
  .meldung {
    position: fixed; left: 16px; right: 16px; bottom: calc(190px + var(--safe-b)); z-index: 20;
    max-width: 520px; margin: 0 auto; background: #5a2a22; color: #fff; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  .leer { color: var(--muted); padding: 40px 0; text-align: center; }
  [hidden] { display: none !important; }

  @media (max-width: 420px) {
    .buch .cover { width: 80px; height: 80px; }
    .detail-cover { width: 116px; height: 116px; }
    .s-knopf { width: 42px; height: 42px; }
    .s-knopf.play { width: 56px; height: 56px; }
  }
</style>
</head>
<body>

<!-- Übersicht: alle Hörbücher -->
<main id="uebersicht" class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 26a16 16 0 0 1 32 0" fill="none" stroke="#e8a24a" stroke-width="4" stroke-linecap="round"/><rect x="5" y="25" width="9" height="15" rx="4" fill="#e8a24a"/><rect x="34" y="25" width="9" height="15" rx="4" fill="#e8a24a"/></svg>
      <h1>Hörbücher</h1>
    </div>
    <p class="sub">Hörbücher für Kinder bis 10 Jahre</p>
    <div class="filter">
      <label class="suchfeld">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="suche" placeholder="Märchen, Titel oder Autor suchen …" autocomplete="off" aria-label="Suchen">
      </label>
      <div class="chips" id="kategorien" aria-label="Kategorien"></div>
      <div class="filter-zeile">
        <div class="segment" id="quelle" role="group" aria-label="Quelle">
          <button data-q="alle" class="an">Alle</button>
          <button data-q="lokal">Gespeichert</button>
          <button data-q="online">Online</button>
        </div>
        <select class="sortierung" id="sortierung" aria-label="Sortierung">
          <option value="beliebt">Beliebteste</option>
          <option value="titel">Titel A–Z</option>
          <option value="autor">Autor A–Z</option>
          <option value="kurz">Kürzeste zuerst</option>
          <option value="lang">Längste zuerst</option>
        </select>
      </div>
      <div class="anzahl" id="anzahl"></div>
    </div>
  </header>
  <ul class="liste" id="liste"><li class="leer">Hörbücher werden geladen …</li></ul>
  <div id="mehr-laden"></div>
</main>

<!-- Titelauswahl eines Hörbuchs -->
<main id="detail" class="wrap" hidden>
  <header class="top" style="padding-top: calc(env(safe-area-inset-top, 0px) + 10px)">
    <button class="zurueck" id="zurueck" aria-label="Zurück zur Übersicht">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Alle Hörbücher
    </button>
  </header>
  <div class="detail-kopf">
    <div class="detail-cover"><img id="d-cover" alt=""></div>
    <div>
      <div class="buch-autor" id="d-autor" style="color:var(--muted)"></div>
      <h2 id="d-titel"></h2>
      <div style="color:var(--muted);font-size:14px" id="d-meta"></div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px" id="d-sprecher"></div>
    </div>
  </div>
  <p class="beschreibung zu" id="d-beschreibung"></p>
  <button class="mehr" id="d-mehr" hidden>Mehr anzeigen</button>
  <ol class="kapitel-liste" id="d-kapitel"></ol>
  <p class="quelle"><span id="d-herkunft"></span> · LibriVox · gemeinfrei · <a id="d-quelle" target="_blank" rel="noopener">Quelle</a></p>
</main>

<!-- Player -->
<section class="player" id="player" aria-label="Player">
  <div class="wrap">
    <div class="p-oben">
      <div class="p-cover"><img id="p-cover" alt=""></div>
      <button class="p-text" id="p-text" aria-label="Zur Titelauswahl">
        <div class="p-titel" id="p-titel"></div>
        <div class="p-buch" id="p-buch"></div>
      </button>
      <button class="tempo" id="tempo" aria-label="Abspielgeschwindigkeit">1×</button>
    </div>
    <div class="zeitleiste">
      <span id="t-jetzt">0:00</span>
      <input type="range" id="regler" min="0" max="1000" value="0" aria-label="Position">
      <span id="t-ende">0:00</span>
    </div>
    <div class="steuerung">
      <button class="s-knopf" id="b-vorher" aria-label="Vorheriger Titel">
        <svg viewBox="0 0 24 24"><path d="M6 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 5.5v13L9 12z" fill="currentColor"/></svg>
      </button>
      <button class="s-knopf spul" data-sek="-60" aria-label="1 Minute zurück">
        <svg viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z" fill="currentColor"/></svg><small>60</small>
      </button>
      <button class="s-knopf spul" data-sek="-15" aria-label="15 Sekunden zurück">
        <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 3.5v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><small>15</small>
      </button>
      <button class="s-knopf play" id="b-play" aria-label="Abspielen">
        <svg viewBox="0 0 24 24" id="i-play"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" id="i-pause" hidden><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>
      <button class="s-knopf spul" data-sek="15" aria-label="15 Sekunden vor">
        <svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 3.5v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><small>15</small>
      </button>
      <button class="s-knopf spul" data-sek="60" aria-label="1 Minute vor">
        <svg viewBox="0 0 24 24"><path d="M4 6v12l8-6zM13 6v12l8-6z" fill="currentColor"/></svg><small>60</small>
      </button>
      <button class="s-knopf" id="b-naechster" aria-label="Nächster Titel">
        <svg viewBox="0 0 24 24"><path d="M18 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M5 5.5v13L15 12z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hinweis">Spul-Knöpfe gedrückt halten = schnell spulen</div>
  </div>
</section>

<audio id="audio" preload="metadata"></audio>
<div class="meldung" id="meldung" hidden role="alert"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const SPEICHER = 'hoerbuecher-stand-v1';
  const TEMPI = [1, 1.25, 1.5, 1.75, 2, 0.75];
  const SEITE = 40;            // so viele Hörbücher werden auf einmal angezeigt

  let buecher = [];            // alle Hörbücher (Repository + online)
  let gefiltert = [];
  let angezeigt = 0;
  let aktBuch = null, aktIndex = -1, ansicht = null, ziehen = false;
  let listeScroll = 0;
  const filter = { text: '', kategorie: 'Alle', quelle: 'alle', sortierung: 'beliebt' };

  // ---------- gespeicherter Stand (pro Hörbuch: Kapitel + Position) ----------
  let stand = {};
  try { stand = JSON.parse(localStorage.getItem(SPEICHER)) || {}; } catch {}
  const speichere = () => { try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch {} };

  const zeit = s => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sek = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sek}` : `${m}:${sek}`;
  };
  const dauerText = s => {
    if (!s) return '';
    const m = Math.max(1, Math.round(s / 60));
    return m < 60 ? `${m} Min.` : `${Math.floor(m / 60)} Std. ${m % 60} Min.`;
  };
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const normal = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');

  // ---------- Ersatz-Cover, falls kein Bild vorhanden ist ----------
  const FARBEN = [['#7a2e2e', '#f3d9a4'], ['#24485f', '#f1e4c8'], ['#3d5a3a', '#f4e7c5'],
                  ['#5b3a6b', '#f2dcc2'], ['#8a5a1f', '#fbefd6'], ['#2f3b4c', '#e8c37e']];
  const svgEsc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function ersatzCover(titel, autor) {
    const [bg, fg] = FARBEN[[...titel].reduce((s, c) => s + c.charCodeAt(0), 0) % FARBEN.length];
    const zeilen = []; let z = '';
    for (const w of titel.split(/\s+/)) {
      if (z && (z + ' ' + w).length > 14) { zeilen.push(z); z = w; } else z = (z + ' ' + w).trim();
    }
    if (z) zeilen.push(z);
    const zl = zeilen.slice(0, 4);
    const gr = Math.max(...zl.map(x => x.length)) <= 10 ? 52 : 42;
    const y0 = 300 - (zl.length - 1) * gr * 0.6;
    const yEnde = y0 + zl.length * gr * 1.2;
    const tsp = zl.map((x, i) => `<tspan x="300" y="${y0 + i * gr * 1.2}">${svgEsc(x)}</tspan>`).join('');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" fill="${bg}"/>` +
      `<rect x="30" y="30" width="540" height="540" fill="none" stroke="${fg}" stroke-width="3" opacity=".7"/>` +
      `<path d="M255 150a45 45 0 0 1 90 0" fill="none" stroke="${fg}" stroke-width="6" stroke-linecap="round"/>` +
      `<rect x="243" y="146" width="18" height="34" rx="8" fill="${fg}"/><rect x="339" y="146" width="18" height="34" rx="8" fill="${fg}"/>` +
      `<text font-family="Georgia,serif" font-size="${gr}" font-weight="bold" fill="${fg}" text-anchor="middle">${tsp}</text>` +
      `<line x1="230" y1="${yEnde - 10}" x2="370" y2="${yEnde - 10}" stroke="${fg}" stroke-width="2" opacity=".6"/>` +
      `<text x="300" y="${yEnde + 34}" font-family="Georgia,serif" font-size="28" font-style="italic" fill="${fg}" text-anchor="middle" opacity=".85">${svgEsc(autor.slice(0, 34))}</text>` +
      `<text x="300" y="530" font-family="Arial,sans-serif" font-size="16" letter-spacing="4" fill="${fg}" text-anchor="middle" opacity=".6">HÖRBUCH</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  const coverVon = b => b.cover || (b._ersatz ||= ersatzCover(b.titel, b.autor));
  // Bild lädt nicht -> Ersatz-Cover
  document.addEventListener('error', e => {
    const img = e.target;
    if (img.tagName !== 'IMG' || !img.dataset.id) return;
    const b = buecher.find(x => x.id === img.dataset.id);
    if (b && !img.src.startsWith('data:')) { b.cover = null; img.src = coverVon(b); }
  }, true);

  // ---------- Übersicht ----------
  function zeigeKategorien() {
    const zaehler = {};
    buecher.forEach(b => { zaehler[b.kategorie] = (zaehler[b.kategorie] || 0) + 1; });
    const reihenfolge = ['Märchen', 'Kindergeschichten', 'Bildergeschichten & Reime', 'Weihnachten'];
    const namen = ['Alle', ...reihenfolge.filter(k => zaehler[k]), ...Object.keys(zaehler).filter(k => !reihenfolge.includes(k))];
    $('kategorien').innerHTML = namen.map(k =>
      `<button class="chip${k === filter.kategorie ? ' an' : ''}" data-k="${esc(k)}">${esc(k)}${k !== 'Alle' ? ` <span style="opacity:.7">${zaehler[k]}</span>` : ''}</button>`).join('');
  }
  $('kategorien').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    filter.kategorie = c.dataset.k;
    $('kategorien').querySelectorAll('.chip').forEach(x => x.classList.toggle('an', x === c));
    filtere();
  });
  $('quelle').addEventListener('click', e => {
    const k = e.target.closest('button'); if (!k) return;
    filter.quelle = k.dataset.q;
    $('quelle').querySelectorAll('button').forEach(x => x.classList.toggle('an', x === k));
    filtere();
  });
  $('sortierung').addEventListener('change', e => { filter.sortierung = e.target.value; filtere(); });
  let suchTimer;
  $('suche').addEventListener('input', e => {
    clearTimeout(suchTimer);
    suchTimer = setTimeout(() => { filter.text = e.target.value; filtere(); }, 150);
  });

  function filtere() {
    const worte = normal(filter.text).split(/\s+/).filter(Boolean);
    gefiltert = buecher.filter(b =>
      (filter.kategorie === 'Alle' || b.kategorie === filter.kategorie) &&
      (filter.quelle === 'alle' || (filter.quelle === 'lokal') === b.lokal) &&
      worte.every(w => b._suche.includes(w)));
    const cmp = {
      beliebt: (a, b) => (b.lokal - a.lokal) || (b.beliebt - a.beliebt),
      titel: (a, b) => a.titel.localeCompare(b.titel, 'de'),
      autor: (a, b) => a.autor.localeCompare(b.autor, 'de') || a.titel.localeCompare(b.titel, 'de'),
      kurz: (a, b) => a.gesamt - b.gesamt,
      lang: (a, b) => b.gesamt - a.gesamt,
    }[filter.sortierung];
    gefiltert.sort(cmp);
    // Angefangene Hörbücher immer oben
    if (filter.sortierung === 'beliebt' && !worte.length) {
      gefiltert.sort((a, b) => (!!stand[b.id]) - (!!stand[a.id]));
    }
    $('anzahl').textContent = gefiltert.length === 1 ? '1 Hörbuch' : `${gefiltert.length} Hörbücher`;
    angezeigt = 0;
    $('liste').innerHTML = gefiltert.length ? '' : '<li class="leer">Keine passenden Hörbücher gefunden.</li>';
    mehrAnzeigen();
  }

  function karte(b) {
    const label = stand[b.id] ? 'Weiterhören' : 'Anhören';
    return `<li class="buch">
      <div class="cover"><img src="${esc(coverVon(b))}" data-id="${esc(b.id)}" alt="Cover: ${esc(b.titel)}" loading="lazy"></div>
      <div class="info">
        <div class="autor">${esc(b.autor)}</div>
        <div class="titel">${esc(b.titel)}</div>
        <div class="meta-zeile">${b.kapitel.length} Titel${b.gesamt ? ' · ' + dauerText(b.gesamt) : ''}<span class="marke${b.lokal ? ' lokal' : ''}">${b.lokal ? 'Gespeichert' : 'Online'}</span></div>
        <button class="knopf" data-id="${esc(b.id)}">
          <svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z" fill="currentColor"/></svg>${label}
        </button>
      </div>
    </li>`;
  }
  function mehrAnzeigen() {
    if (angezeigt >= gefiltert.length) return;
    const neu = gefiltert.slice(angezeigt, angezeigt + SEITE);
    $('liste').insertAdjacentHTML('beforeend', neu.map(karte).join(''));
    angezeigt += neu.length;
  }
  new IntersectionObserver(es => {
    if (es[0].isIntersecting && !$('uebersicht').hidden) mehrAnzeigen();
  }, { rootMargin: '600px' }).observe($('mehr-laden'));

  $('liste').addEventListener('click', e => {
    const k = e.target.closest('.knopf');
    if (k) { listeScroll = window.scrollY; location.hash = '#/' + encodeURIComponent(k.dataset.id); }
  });

  // ---------- Titelauswahl ----------
  function zeigeDetail(b) {
    ansicht = b;
    $('d-cover').src = coverVon(b); $('d-cover').dataset.id = b.id; $('d-cover').alt = 'Cover: ' + b.titel;
    $('d-autor').textContent = b.autor;
    $('d-titel').textContent = b.titel;
    $('d-meta').textContent = `${b.kapitel.length} Titel${b.gesamt ? ' · ' + dauerText(b.gesamt) : ''}`;
    $('d-sprecher').textContent = b.sprecher ? 'Gelesen von ' + b.sprecher : '';
    const besch = $('d-beschreibung');
    besch.textContent = b.beschreibung || '';
    besch.classList.add('zu');
    $('d-mehr').hidden = !b.beschreibung || b.beschreibung.length < 180;
    $('d-mehr').textContent = 'Mehr anzeigen';
    $('d-quelle').href = b.quelle;
    $('d-herkunft').textContent = b.lokal ? 'Im Repository gespeichert' : 'Gestreamt vom Internet Archive';
    zeigeKapitel();
  }
  function zeigeKapitel() {
    const b = ansicht; if (!b) return;
    const st = stand[b.id] || {};
    $('d-kapitel').innerHTML = b.kapitel.map((k, i) => {
      const aktiv = aktBuch === b && aktIndex === i;
      const gemerkt = !aktiv && st.kapitel === i && st.pos > 5;
      const prozent = gemerkt && k.dauer ? Math.min(100, st.pos / k.dauer * 100) : 0;
      return `<li><button class="kapitel${aktiv ? ' aktiv' : ''}" data-i="${i}">
        <span class="nr">${i + 1}</span>
        <span class="k-titel">${esc(k.titel)}${gemerkt ? `<span class="fortschritt"><i style="width:${prozent}%"></i></span>` : ''}</span>
        <span class="k-dauer">${k.dauer ? zeit(k.dauer) : ''}</span>
      </button></li>`;
    }).join('');
  }
  $('d-kapitel').addEventListener('click', e => {
    const k = e.target.closest('.kapitel'); if (!k) return;
    const i = +k.dataset.i;
    if (aktBuch === ansicht && aktIndex === i) { audio.paused ? audio.play() : audio.pause(); return; }
    const st = stand[ansicht.id];
    spiele(ansicht, i, st && st.kapitel === i ? st.pos : 0);
  });
  $('d-mehr').addEventListener('click', () => {
    const zu = $('d-beschreibung').classList.toggle('zu');
    $('d-mehr').textContent = zu ? 'Mehr anzeigen' : 'Weniger anzeigen';
  });
  $('zurueck').addEventListener('click', () => {
    if (history.length > 1 && location.hash.startsWith('#/')) history.back(); else location.hash = '';
  });
  $('p-text').addEventListener('click', () => {
    if (aktBuch) { if (!ansicht) listeScroll = window.scrollY; location.hash = '#/' + encodeURIComponent(aktBuch.id); }
  });

  // ---------- Navigation (Übersicht <-> Titelauswahl) ----------
  function route() {
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const b = buecher.find(x => x.id === id);
    $('uebersicht').hidden = !!b;
    $('detail').hidden = !b;
    if (b) { zeigeDetail(b); window.scrollTo(0, 0); }
    else {
      ansicht = null;
      // Knöpfe "Anhören/Weiterhören" aktualisieren, Liste und Scroll-Position behalten
      const schon = angezeigt;
      filtere();
      while (angezeigt < schon && angezeigt < gefiltert.length) mehrAnzeigen();
      window.scrollTo(0, listeScroll);
    }
  }
  window.addEventListener('hashchange', route);

  // ---------- Abspielen ----------
  let meldungTimer;
  function meldung(text) {
    const m = $('meldung'); m.textContent = text; m.hidden = false;
    clearTimeout(meldungTimer); meldungTimer = setTimeout(() => { m.hidden = true; }, 6000);
  }
  audio.addEventListener('error', () => {
    if (!aktBuch) return;
    meldung(aktBuch.lokal
      ? 'Dieser Titel konnte nicht geladen werden.'
      : 'Dieser Titel konnte nicht vom Internet Archive geladen werden. Bitte Internetverbindung prüfen oder später erneut versuchen.');
  });

  function spiele(b, i, pos = 0) {
    if (i < 0 || i >= b.kapitel.length) return;
    aktBuch = b; aktIndex = i;
    const k = b.kapitel[i];
    $('meldung').hidden = true;
    audio.src = k.datei;
    audio.playbackRate = tempo;
    const start = () => { if (pos > 0 && pos < (audio.duration || Infinity) - 2) audio.currentTime = pos; audio.playbackRate = tempo; };
    audio.addEventListener('loadedmetadata', start, { once: true });
    audio.play().catch(() => {});
    stand[b.id] = { kapitel: i, pos };
    speichere();
    $('player').classList.add('sichtbar');
    $('p-cover').src = coverVon(b);
    $('p-titel').textContent = k.titel;
    $('p-buch').textContent = `${b.titel} · Titel ${i + 1} von ${b.kapitel.length}`;
    $('b-naechster').disabled = i >= b.kapitel.length - 1;
    zeigeKapitel();
    mediaSession(b, k);
  }

  function vorher() {
    if (!aktBuch) return;
    if (audio.currentTime > 5 || aktIndex === 0) audio.currentTime = 0;   // erst an den Anfang des Titels
    else spiele(aktBuch, aktIndex - 1);
  }
  function naechster() { if (aktBuch && aktIndex < aktBuch.kapitel.length - 1) spiele(aktBuch, aktIndex + 1); }
  function spulen(sek) {
    if (!aktBuch || !isFinite(audio.duration)) return;
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sek), audio.duration - 0.5);
    aktualisiereZeit();
  }

  $('b-play').addEventListener('click', () => {
    if (!aktBuch) {
      const b = ansicht || gefiltert[0]; if (!b) return;
      const st = stand[b.id];
      return spiele(b, st ? st.kapitel : 0, st ? st.pos : 0);
    }
    audio.paused ? audio.play() : audio.pause();
  });
  $('b-vorher').addEventListener('click', vorher);
  $('b-naechster').addEventListener('click', naechster);

  // Spul-Knöpfe: kurz tippen = einmal springen, gedrückt halten = schnell spulen
  document.querySelectorAll('.spul').forEach(btn => {
    const sek = +btn.dataset.sek;
    let warte = null, takt = null, gehalten = false;
    const stop = () => { clearTimeout(warte); clearInterval(takt); btn.classList.remove('halten'); warte = takt = null; };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      gehalten = false;
      warte = setTimeout(() => {
        gehalten = true;
        btn.classList.add('halten');
        let schritte = 0;
        takt = setInterval(() => {
          schritte++;
          const faktor = schritte > 15 ? 4 : schritte > 6 ? 2 : 1;   // wird beim Halten immer schneller
          spulen(Math.sign(sek) * 10 * faktor);
        }, 180);
      }, 400);
    });
    btn.addEventListener('pointerup', () => { if (!gehalten) spulen(sek); stop(); });
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spulen(sek); } });
  });

  // Geschwindigkeit
  let tempo = 1;
  try { tempo = +localStorage.getItem('hoerbuecher-tempo') || 1; } catch {}
  const zeigeTempo = () => { $('tempo').textContent = String(tempo).replace('.', ',') + '×'; };
  zeigeTempo();
  $('tempo').addEventListener('click', () => {
    tempo = TEMPI[(TEMPI.indexOf(tempo) + 1) % TEMPI.length];
    audio.playbackRate = tempo; zeigeTempo();
    try { localStorage.setItem('hoerbuecher-tempo', tempo); } catch {}
  });

  // Zeitleiste
  const regler = $('regler');
  function aktualisiereZeit() {
    const d = audio.duration;
    $('t-jetzt').textContent = zeit(audio.currentTime);
    $('t-ende').textContent = isFinite(d) ? '−' + zeit(d - audio.currentTime) : '0:00';
    if (!ziehen && isFinite(d) && d > 0) {
      regler.value = Math.round(audio.currentTime / d * 1000);
      regler.style.setProperty('--p', regler.value / 10 + '%');
    }
  }
  regler.addEventListener('input', () => {
    ziehen = true;
    regler.style.setProperty('--p', regler.value / 10 + '%');
    if (isFinite(audio.duration)) $('t-jetzt').textContent = zeit(regler.value / 1000 * audio.duration);
  });
  regler.addEventListener('change', () => {
    if (isFinite(audio.duration)) audio.currentTime = regler.value / 1000 * audio.duration;
    ziehen = false;
  });

  let letzteSicherung = 0;
  audio.addEventListener('timeupdate', () => {
    aktualisiereZeit();
    if (aktBuch && Date.now() - letzteSicherung > 3000) {
      letzteSicherung = Date.now();
      stand[aktBuch.id] = { kapitel: aktIndex, pos: audio.currentTime };
      speichere();
    }
    if ('mediaSession' in navigator && isFinite(audio.duration)) {
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: audio.playbackRate }); } catch {}
    }
  });
  audio.addEventListener('play', () => { $('i-play').hidden = true; $('i-pause').hidden = false; $('b-play').setAttribute('aria-label', 'Pause'); });
  audio.addEventListener('pause', () => {
    $('i-play').hidden = false; $('i-pause').hidden = true; $('b-play').setAttribute('aria-label', 'Abspielen');
    if (aktBuch) { stand[aktBuch.id] = { kapitel: aktIndex, pos: audio.currentTime }; speichere(); }
  });
  audio.addEventListener('ended', () => {
    if (aktIndex < aktBuch.kapitel.length - 1) spiele(aktBuch, aktIndex + 1);
    else { stand[aktBuch.id] = { kapitel: 0, pos: 0 }; speichere(); zeigeKapitel(); }
  });

  // Sperrbildschirm / Kopfhörer-Tasten (iPhone & Android)
  function mediaSession(b, k) {
    if (!('mediaSession' in navigator)) return;
    const bild = coverVon(b);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: k.titel, artist: b.autor, album: b.titel,
      artwork: bild.startsWith('data:') ? [] : [{ src: new URL(bild, location.href).href, sizes: '512x512' }]
    });
    const ms = navigator.mediaSession;
    const setze = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
    setze('play', () => audio.play());
    setze('pause', () => audio.pause());
    setze('previoustrack', vorher);
    setze('nexttrack', naechster);
    setze('seekbackward', d => spulen(-(d.seekOffset || 15)));
    setze('seekforward', d => spulen(d.seekOffset || 15));
    setze('seekto', d => { audio.currentTime = d.seekTime; });
  }

  // Tastatur (am Computer): Leertaste, Pfeile
  document.addEventListener('keydown', e => {
    if (!aktBuch || e.target.matches('input, button, select')) return;
    if (e.key === ' ') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
    if (e.key === 'ArrowLeft') spulen(e.shiftKey ? -60 : -15);
    if (e.key === 'ArrowRight') spulen(e.shiftKey ? 60 : 15);
  });

  // ---------- Daten laden ----------
  function vorbereiten(b) {
    b.gesamt = b.kapitel.reduce((s, k) => s + (k.dauer || 0), 0);
    b._suche = normal([b.titel, b.autor, b.sprecher, ...b.kapitel.map(k => k.titel)].join(' '));
    return b;
  }
  const lokal = fetch('hoerbuecher.json', { cache: 'no-cache' }).then(r => r.json())
    .then(d => (d.hoerbuecher || []).map(b => vorbereiten({ ...b, lokal: true, beliebt: Infinity, kategorie: b.kategorie || 'Kindergeschichten' })))
    .catch(() => []);
  const online = fetch('katalog-online.json', { cache: 'no-cache' }).then(r => r.json())
    .then(d => (d.hoerbuecher || []).map(b => {
      const basis = d.basis + encodeURIComponent(b.id) + '/';
      const pfad = n => basis + n.split('/').map(encodeURIComponent).join('/');
      return vorbereiten({
        id: b.id, titel: b.titel, autor: b.autor, sprecher: b.sprecher, beschreibung: b.beschreibung,
        kategorie: b.kategorie, beliebt: b.beliebt, lokal: false,
        quelle: 'https://archive.org/details/' + b.id,
        cover: b.cover ? pfad(b.cover) : null,
        kapitel: b.kapitel.map(k => ({ titel: k.t, datei: pfad(k.d), dauer: k.s })),
      });
    }))
    .catch(() => []);
  Promise.all([lokal, online]).then(([a, b]) => {
    const ids = new Set(a.map(x => x.id));
    buecher = [...a, ...b.filter(x => !ids.has(x.id))];
    if (!buecher.length) { $('liste').innerHTML = '<li class="leer">Die Hörbuchliste konnte nicht geladen werden.</li>'; return; }
    zeigeKategorien();
    route();
  });
})();
</script>
</body>
</html>
